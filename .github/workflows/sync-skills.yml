name: Sync vendored skills

# Mirrors the upstream repos listed in sources.json into skills/ and opens a PR
# when anything changed. This is the "updates when they update" mechanism:
# it runs on a schedule and on-demand, and you review the PR before it ships.
#
# The workflow automatically enables "Allow GitHub Actions to create and approve
# pull requests" on first run (requires administration: write permission).
# If that step fails, enable it manually in:
#   repo Settings → Actions → General → Workflow permissions

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write
  administration: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync skills from sources.json
        env:
          SYNC_TIMESTAMP: ${{ github.event.repository.updated_at }}
        run: node scripts/sync-skills.js

      - name: Enable Actions to create pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/permissions/workflow \
            -X PUT \
            -F can_approve_pull_request_reviews=true \
            || echo "::warning::Could not enable 'Allow GitHub Actions to create pull requests' automatically. Enable it manually in repo Settings → Actions → General → Workflow permissions."

      - name: Open PR with any changes
        # Pinned to a full commit SHA (supply-chain safety); comment tracks the tag.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          branch: sync/vendored-skills
          commit-message: 'chore: sync vendored skills from upstream'
          title: 'chore: sync vendored skills from upstream'
          body: |
            Automated sync of vendored skills from the sources in `sources.json`.

            Review the diff below — vendored skills are mirrored verbatim from
            their upstream repos (see `VENDORED.md` for source + commit + license).
            Merge to publish the updates.
          labels: automated, skills-sync
          delete-branch: true
